<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playstack: new games</title>
<!--
  The Playstack Home banner (web variant). The app shows it 132 dp tall at full width, with no scrolling;
  a tap opens the config's "link" in the browser. Self-contained: no fonts, images or scripts to fetch.
-->
<style>
  :root {
    --text: #F3F6FF;
    --dim: #9AA8CC;
    --cyan: #26D7E6;
    --green: #27A84F;
    --pink: #D63F86;
    --amber: #F2B21B;
    --blue: #2F6FE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, #14305E, #103E6E, #0E5470);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 0 20px;
  }
  .copy { flex: 1; min-width: 0; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--cyan);
    color: #0A1630;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  h1 { margin: 6px 0 4px; font-size: 22px; line-height: 1.1; font-weight: 800; }
  h1 em { font-style: normal; color: var(--cyan); }
  p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--dim); }
  p span { display: block; white-space: nowrap; }

  /* Four tiles in a 2×2 grid, one per new game, each with a tiny looping scene. */
  .tiles { display: grid; grid-template-columns: repeat(2, 50px); gap: 8px; flex: none; }
  .tile {
    width: 50px; height: 50px;
    border-radius: 13px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 12px 14px -10px rgba(255, 255, 255, 0.25);
    animation: float 3.2s ease-in-out infinite;
  }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slope { background: var(--green); }
  .melon { background: var(--pink); animation-delay: -0.8s; }
  .tower { background: var(--amber); animation-delay: -1.6s; }
  .hoop { background: var(--blue); animation-delay: -2.4s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* Slope: the ball steers left and right down the track. */
  .ball-steer { animation: steer 2.4s ease-in-out infinite; }
  @keyframes steer { 0%, 100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  .lines { animation: run 0.6s linear infinite; }
  @keyframes run { from { transform: translateY(0); } to { transform: translateY(8px); } }

  /* Watermelon: a fruit drops and lands on the pile. */
  .drop { animation: drop 1.8s cubic-bezier(.5, 0, .9, .6) infinite; }
  @keyframes drop {
    0% { transform: translateY(-22px); opacity: 0; }
    15% { opacity: 1; }
    55%, 100% { transform: translateY(0); opacity: 1; }
  }

  /* Tower: the top block slides across, then settles. */
  .slide { animation: slide 2s ease-in-out infinite; }
  @keyframes slide { 0%, 100% { transform: translateX(-9px); } 50% { transform: translateX(9px); } }

  /* Hoop Flap: the ball flaps up and falls through the hoop. */
  .flap { animation: flap 1.4s ease-in-out infinite; }
  @keyframes flap {
    0%, 100% { transform: translate(-7px, 4px); }
    30% { transform: translate(-2px, -8px); }
    70% { transform: translate(5px, 2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <span class="pill">NEW</span>
      <h1>4 new <em>games</em></h1>
      <p><span>Slope · Watermelon</span> <span>Tower · Hoop Flap</span></p>
    </div>
    <div class="tiles" aria-hidden="true">
      <div class="tile slope">
        <svg viewBox="0 0 50 50">
          <path d="M19 8 H31 L42 46 H8 Z" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
          <g class="lines" stroke="rgba(255,255,255,0.45)" stroke-width="1">
            <line x1="12" y1="18" x2="38" y2="18"/><line x1="11" y1="26" x2="39" y2="26"/>
            <line x1="10" y1="34" x2="40" y2="34"/><line x1="9" y1="42" x2="41" y2="42"/>
          </g>
          <g class="ball-steer"><circle cx="25" cy="34" r="6" fill="#C9FFD9"/><circle cx="23" cy="32" r="2" fill="#fff"/></g>
        </svg>
      </div>
      <div class="tile melon">
        <svg viewBox="0 0 50 50">
          <circle cx="16" cy="40" r="8" fill="#F5A425"/>
          <circle cx="32" cy="38" r="10" fill="#2FA84F"/>
          <path d="M26 31 v14 M32 28 v20 M38 31 v14" stroke="#1C7A35" stroke-width="1.6"/>
          <g class="drop"><circle cx="20" cy="22" r="5.5" fill="#E8463C"/><path d="M20 16.5 l2 -4" stroke="#2FA84F" stroke-width="1.6" stroke-linecap="round"/></g>
        </svg>
      </div>
      <div class="tile tower">
        <svg viewBox="0 0 50 50">
          <rect x="13" y="38" width="24" height="7" rx="1.5" fill="#fff"/>
          <rect x="13" y="30" width="24" height="7" rx="1.5" fill="#FFF3C4"/>
          <rect x="13" y="22" width="24" height="7" rx="1.5" fill="#fff"/>
          <rect class="slide" x="13" y="13" width="24" height="7" rx="1.5" fill="#FFE07A"/>
        </svg>
      </div>
      <div class="tile hoop">
        <svg viewBox="0 0 50 50">
          <ellipse cx="34" cy="24" rx="9" ry="3" fill="none" stroke="#FF8A3D" stroke-width="2.4"/>
          <path d="M26 25 l3 11 h10 l3 -11" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
          <g class="flap"><circle cx="17" cy="24" r="6" fill="#F5A425"/><path d="M11.5 24 h11 M17 18.5 v11" stroke="#B5651D" stroke-width="1"/></g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
