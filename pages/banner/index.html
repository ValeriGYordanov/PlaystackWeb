<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playstack: new games</title>
<!--
  The Playstack Home banner (web variant). The app shows it 132 dp tall at full width, with no scrolling;
  a tap opens the config's "link" in the browser. Self-contained: no fonts, images or scripts to fetch.
-->
<style>
  :root {
    /* The app's palette (core/design/Palette.kt): --cyan is its main accent, green. */
    --text: #F2F2F2;
    --dim: #AEAEB4;
    --cyan: #2ECC71;
    --navy: #2A4C9A;
    --teal: #119E93;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #121214;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 0 20px;
  }
  .copy { flex: 1; min-width: 0; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--cyan);
    color: #000000;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  h1 { margin: 6px 0 4px; font-size: 22px; line-height: 1.1; font-weight: 800; }
  h1 em { font-style: normal; color: var(--cyan); }
  p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--dim); }
  p span { display: block; white-space: nowrap; }

  /* Two tiles side by side, one per new game, each with a tiny looping scene. */
  .tiles { display: grid; grid-template-columns: repeat(2, 62px); gap: 10px; flex: none; }
  .tile {
    width: 62px; height: 62px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 12px 14px -10px rgba(255, 255, 255, 0.25);
    animation: float 3.2s ease-in-out infinite;
  }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .control { background: var(--navy); }
  .way { background: var(--teal); animation-delay: -1.6s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* Pillar Control: troops march from the white pillar to the red one along a flowing line. */
  .stream { stroke-dasharray: 4 3; animation: flow 0.8s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -7; } }
  .troop { animation: march 1.5s linear infinite; }
  .troop.t2 { animation-delay: -0.5s; }
  .troop.t3 { animation-delay: -1s; }
  @keyframes march { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(20px, -19px); opacity: 0; } }
  .hit { animation: hit 1.5s ease-out infinite; transform-origin: 37px 15px; }
  @keyframes hit { 0%, 80% { transform: scale(1); } 90% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* Pillar Way: enemies walk the winding road while the pillar fires at them. */
  .walker { animation: walk 3s linear infinite; }
  .walker.w2 { animation-delay: -1s; }
  .walker.w3 { animation-delay: -2s; }
  @keyframes walk {
    0% { transform: translate(0, 0); opacity: 0; }
    8% { opacity: 1; }
    40% { transform: translate(0, 18px); }
    70% { transform: translate(24px, 18px); }
    92% { opacity: 1; }
    100% { transform: translate(24px, 36px); opacity: 0; }
  }
  .shot { animation: shot 1s ease-out infinite; }
  @keyframes shot { 0%, 55% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  /* ?theme=light (sent by the app in its light theme): the palette's light set. Without it the page stays dark. */
  html.light { --text: #17171B; --dim: #55555F; --cyan: #1FA65A; }
  html.light body { background: #FFFFFF; }
  html.light .pill { color: #FFFFFF; }
</style>
<script>
  // The app adds ?theme=light in its light theme; older versions send nothing, so dark stays the default.
  if (new URLSearchParams(location.search).get('theme') === 'light') document.documentElement.classList.add('light');
</script>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <span class="pill">NEW</span>
      <h1>2 new <em>games</em></h1>
      <p><span>Pillar Control</span> <span>Pillar Way</span></p>
    </div>
    <div class="tiles" aria-hidden="true">
      <div class="tile control">
        <svg viewBox="0 0 50 50">
          <line class="stream" x1="15" y1="35" x2="37" y2="15" stroke="rgba(255,255,255,0.7)" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="15" y1="35" x2="38" y2="39" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round"/>
          <g class="troop"><circle cx="17" cy="33" r="1.9" fill="#fff"/></g>
          <g class="troop t2"><circle cx="17" cy="33" r="1.9" fill="#fff"/></g>
          <g class="troop t3"><circle cx="17" cy="33" r="1.9" fill="#fff"/></g>
          <circle cx="15" cy="36" r="8.5" fill="rgba(0,0,0,0.18)"/>
          <circle cx="15" cy="35" r="8.5" fill="#fff"/>
          <circle cx="15" cy="35" r="6.6" fill="none" stroke="rgba(42,76,154,0.25)" stroke-width="1"/>
          <g class="hit"><circle cx="37" cy="15" r="7.5" fill="#FF7A7D"/><circle cx="37" cy="15" r="5.8" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/></g>
          <circle cx="38" cy="39" r="5.5" fill="#93C5FD"/>
        </svg>
      </div>
      <div class="tile way">
        <svg viewBox="0 0 50 50">
          <path d="M13 0 V25 H37 V50" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linejoin="round"/>
          <g class="walker"><circle cx="13" cy="7" r="2.6" fill="#FF7A7D"/></g>
          <g class="walker w2"><circle cx="13" cy="7" r="2.6" fill="#FFD166"/></g>
          <g class="walker w3"><circle cx="13" cy="7" r="2.6" fill="#7EE2A8"/></g>
          <line class="shot" x1="25" y1="38" x2="36" y2="29" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="25" cy="39" r="7.5" fill="rgba(0,0,0,0.18)"/>
          <circle cx="25" cy="38" r="7.5" fill="#fff"/>
          <circle cx="25" cy="38" r="5" fill="#BFDBFE"/>
          <circle cx="25" cy="38" r="1.6" fill="#2F6FE0"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
