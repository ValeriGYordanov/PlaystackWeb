<title>Playstack: Paint Duel</title>
<!--
  The Playstack Home banner (web variant), 2026-11-25: Paint Duel, the first 3D game. The app shows it 132 dp tall
  at full width, with no scrolling; a tap opens the config's "link" in the browser. Self-contained: the art is Paint
  Duel's own wide tile (games/paintduel/.../paintduel_tile_wide_bg.webp and _fg.webp), embedded as data: URLs.
-->
<style>
  :root {
    /* The app's palette (core/design/Palette.kt): --cyan is its main accent, green. */
    --text: #F2F2F2;
    --dim: #AEAEB4;
    --cyan: #2ECC71;
    --frame: rgba(255, 255, 255, 0.10);
    /* The art box shows the part of the 1024×512 tile with the two players: x 150–870, y 110–430. */
    --w: min(160px, 40vw);
    --s: calc(var(--w) / 720);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #121214;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px 0 20px;
  }
  .copy { flex: 1; min-width: 0; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, #7C5CFF, #2ECC71);
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  h1 { margin: 6px 0 4px; font-size: 24px; line-height: 1.05; font-weight: 800; white-space: nowrap; }
  h1 em { font-style: normal; color: var(--cyan); }
  p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--dim); }
  p span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* The art: Paint Duel's tile, cropped to the players, in a premium ring like the app's 3D tiles. */
  .art {
    position: relative;
    flex: none;
    width: calc(var(--w) + 6px);
    height: calc(var(--w) * 320 / 720 + 6px);
    padding: 3px;
    border-radius: 16px;
    background: linear-gradient(120deg, #7C5CFF, #2ECC71, #FFD166, #FF7A7D, #7C5CFF);
    background-size: 300% 300%;
    animation: ring 6s linear infinite;
  }
  @keyframes ring { to { background-position: 300% 0; } }
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 13px;
    overflow: hidden;
  }
  .layer {
    position: absolute;
    left: calc(-150 * var(--s));
    top: calc(-110 * var(--s));
    width: calc(1024 * var(--s));
    height: calc(512 * var(--s));
  }

  /* A light sweep across the art, as on the app's 3D tiles. */
  .sweep {
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.35) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: sweep 4s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

  /* Paintballs fly from each gun to the other wall and splat. Coordinates are tile pixels from the crop's corner, times --s. */
  .ball { position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; opacity: 0; }
  .ball.g { background: #7EE2A8; left: calc(165 * var(--s)); top: calc(72 * var(--s)); animation: shotR 2.4s ease-in infinite; }
  .ball.y { background: #FFD166; left: calc(500 * var(--s)); top: calc(60 * var(--s)); animation: shotL 2.4s ease-in infinite; animation-delay: -1.2s; }
  @keyframes shotR { 0%, 20% { transform: translate(0, 0); opacity: 0; } 22% { opacity: 1; } 48% { transform: translate(calc(350 * var(--s)), calc(158 * var(--s))); opacity: 1; } 50%, 100% { transform: translate(calc(350 * var(--s)), calc(158 * var(--s))); opacity: 0; } }
  @keyframes shotL { 0%, 20% { transform: translate(0, 0); opacity: 0; } 22% { opacity: 1; } 48% { transform: translate(calc(-295 * var(--s)), calc(175 * var(--s))); opacity: 1; } 50%, 100% { transform: translate(calc(-295 * var(--s)), calc(175 * var(--s))); opacity: 0; } }
  .splat { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; opacity: 0; }
  .splat.g { background: radial-gradient(circle, #7EE2A8 45%, transparent 70%); left: calc(515 * var(--s)); top: calc(230 * var(--s)); animation: splat 2.4s ease-out infinite; }
  .splat.y { background: radial-gradient(circle, #FFD166 45%, transparent 70%); left: calc(205 * var(--s)); top: calc(235 * var(--s)); animation: splat 2.4s ease-out infinite; animation-delay: -1.2s; }
  @keyframes splat { 0%, 48% { transform: scale(0.2); opacity: 0; } 52% { transform: scale(1.2); opacity: 0.95; } 80% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  /* ?theme=light (sent by the app in its light theme): the palette's light set. Without it the page stays dark. */
  html.light { --text: #17171B; --dim: #55555F; --cyan: #1FA65A; }
  html.light body { background: #FFFFFF; }
</style>
<script>
  // The app adds ?theme=light in its light theme; older versions send nothing, so dark stays the default.
  if (new URLSearchParams(location.search).get('theme') === 'light') document.documentElement.classList.add('light');
</script>
