<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playstack: online play</title>
<!--
  The Playstack Online tab banner (online_banner, web variant). Shown 132 dp tall at full width, no scrolling;
  a tap opens the config's "link". Self-contained: no fonts, images or scripts to fetch.
-->
<style>
  :root {
    --text: #F3F6FF;
    --dim: #9AA8CC;
    --cyan: #26D7E6;
    --orange: #FFBE2E;
    --blue: #2F6FE0;
    --pink: #D63F86;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, #14305E, #103E6E, #0E5470);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; }
  .copy { flex: 1; min-width: 0; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--orange); color: #0A1630;
    font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
  }
  h1 { margin: 6px 0 4px; font-size: 22px; line-height: 1.1; font-weight: 800; }
  h1 em { font-style: normal; color: var(--cyan); }
  p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--dim); }
  p span { display: block; white-space: nowrap; }

  /* Two players facing off over a pulsing link. */
  .art { width: 120px; height: 100px; flex: none; }
  .art svg { width: 100%; height: 100%; overflow: visible; }
  .p1 { animation: bob 2.4s ease-in-out infinite; }
  .p2 { animation: bob 2.4s ease-in-out infinite; animation-delay: -1.2s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .dot { animation: travel 1.6s linear infinite; }
  .dot.b { animation-delay: -0.8s; }
  @keyframes travel {
    0% { transform: translateX(0); opacity: 0; }
    15%, 85% { opacity: 1; }
    100% { transform: translateX(44px); opacity: 0; }
  }
  .vs { animation: pulse 1.6s ease-in-out infinite; transform-origin: 60px 50px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <span class="pill">COMING SOON</span>
      <h1>Online <em>play</em></h1>
      <p><span>Play with friends</span> <span>and players worldwide</span></p>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 120 100">
        <!-- Player one: a cyan tile with a face. -->
        <g class="p1">
          <rect x="4" y="30" width="34" height="34" rx="9" fill="var(--blue)"/>
          <circle cx="21" cy="44" r="7" fill="#fff"/>
          <path d="M11 60 q10 -12 20 0" fill="#fff"/>
        </g>
        <!-- Player two: a pink tile. -->
        <g class="p2">
          <rect x="82" y="30" width="34" height="34" rx="9" fill="var(--pink)"/>
          <circle cx="99" cy="44" r="7" fill="#fff"/>
          <path d="M89 60 q10 -12 20 0" fill="#fff"/>
        </g>
        <!-- The link between them. -->
        <line x1="40" y1="47" x2="80" y2="47" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="3 4"/>
        <circle class="dot" cx="38" cy="47" r="2.6" fill="var(--cyan)"/>
        <circle class="dot b" cx="38" cy="47" r="2.6" fill="var(--cyan)"/>
        <g class="vs">
          <circle cx="60" cy="50" r="11" fill="#0A1630" stroke="var(--orange)" stroke-width="2"/>
          <text x="60" y="54" text-anchor="middle" font-size="10" font-weight="800" fill="var(--orange)" font-family="system-ui, sans-serif">VS</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
